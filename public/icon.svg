<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Glowing Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="185" fill="#0E172E" stroke="#1E293B" stroke-width="3"/>
  
  <!-- Stylized Bus Silhouette -->
  <g transform="translate(116, 126)" fill="#FFFFFF">
    <!-- Bus Main Body -->
    <path d="M 20 20 C 20 5 40 0 140 0 C 240 0 260 5 260 20 L 270 170 C 270 185 260 195 240 195 L 240 220 C 240 230 230 235 220 235 L 205 235 C 195 235 190 230 190 220 L 190 195 L 90 195 L 90 220 C 90 230 85 235 75 235 L 60 235 C 50 235 40 230 40 220 L 40 195 C 20 195 10 185 10 170 Z" fill="#FFFFFF"/>
    
    <!-- Windshield -->
    <path d="M 35 25 C 35 20 45 15 140 15 C 235 15 245 20 245 25 L 245 85 C 245 90 240 95 230 95 L 50 95 C 40 95 35 90 35 85 Z" fill="#0F172A"/>
    
    <!-- Windshield center divider and reflections -->
    <rect x="138" y="15" width="4" height="80" fill="#334155"/>
    <polygon points="50,25 70,25 100,85 80,85" fill="#38BDF8" opacity="0.4"/>
    
    <!-- Grille & Radiator -->
    <rect x="75" y="125" width="130" height="25" rx="5" fill="#1E293B"/>
    <line x1="85" y1="133" x2="195" y2="133" stroke="#94A3B8" stroke-width="2"/>
    <line x1="85" y1="141" x2="195" y2="141" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Headlights -->
    <circle cx="45" cy="138" r="14" fill="#FBBF24"/>
    <circle cx="235" cy="138" r="14" fill="#FBBF24"/>
    <circle cx="45" cy="138" r="8" fill="#FFFBEB"/>
    <circle cx="235" cy="138" r="8" fill="#FFFBEB"/>
    
    <!-- Bumper -->
    <rect x="25" y="165" width="230" height="18" rx="6" fill="#334155"/>
    <rect x="110" y="168" width="60" height="12" rx="3" fill="#0284C7"/>
  </g>
  
  <!-- AJP LOGIC BADGE -->
  <rect x="166" y="415" width="180" height="34" rx="17" fill="#0369A1" stroke="#38BDF8" stroke-width="2"/>
  <text x="256" y="437" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#E0F2FE" text-anchor="middle" letter-spacing="3">BUSCONTROL</text>
</svg>
